[package]
name = "kabootarbook"
version = "0.2.0"
edition = "2021"

[lib]
name = "kabootarbook"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jni = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
