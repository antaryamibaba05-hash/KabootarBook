name: Native Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_NDK_PLATFORM: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CARGO_NDK_PLATFORM=24" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build native Compose APK
        working-directory: native
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signing
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose native/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kabootarbook-native-android-apk
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
