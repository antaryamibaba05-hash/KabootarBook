[package]
name = "kabootarbook"
version = "0.1.0"
description = "Offline pigeon flight log"
authors = ["Rana Adeel Jameel"]
edition = "2021"

[lib]
name = "kabootarbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
