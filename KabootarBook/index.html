<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="KabootarBook — a private, offline pigeon flight log.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>KabootarBook</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Main navigation">
      <a class="brand" href="#today" aria-label="KabootarBook home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 31c7-1 9-8 14-14 5 8 10 10 18 7-3 8-10 13-20 12l-7 5 2-8c-3 0-5-.7-7-2Z"/><circle cx="31" cy="18" r="1.4"/></svg></span>
        <span class="brand-word">Kabootar<span>Book</span><small>LOFT JOURNAL</small></span>
      </a>
      <nav class="nav-list">
        <button class="nav-item active" data-page="today"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v9l6 3"/><circle cx="12" cy="12" r="9"/></svg></span><span>Today</span></button>
        <button class="nav-item" data-page="pigeons"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19c3-1 3-4 5-7 2 3 5 4 10 2-2 5-6 7-11 6l-3 2 1-3Z"/><circle cx="15.5" cy="8" r="1"/></svg></span><span>Pigeons</span></button>
        <button class="nav-item" data-page="flights"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17 19 5M9 5h10v10"/></svg></span><span>Flights</span></button>
        <button class="nav-item" data-page="insights"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 18h18M5 15l4-5 4 3 6-8"/><path d="M15 5h4v4"/></svg></span><span>Insights</span></button>
      </nav>
      <div class="rail-bottom"><span class="offline-dot"></span><span>Stored on this device</span><button class="settings-link" data-page="settings" aria-label="Settings">⚙</button></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div><p class="eyebrow" id="today-date"></p><h1 id="page-title">A good day at the loft.</h1></div><div class="top-actions"><span class="privacy-pill"><span class="offline-dot"></span>Offline</span><button class="avatar" data-page="settings" aria-label="Open settings">AJ</button></div></header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="modal"></dialog>
  <input id="csv-input" class="hidden" type="file" accept=".csv,text/csv">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
